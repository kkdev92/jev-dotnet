name: release

# Publishes to NuGet from a tag. Everything that gates a pull request runs again here against a
# clean checkout, because a release is the one build nobody gets to re-run after the fact.
#
# Four jobs, split by what each one is trusted with:
#
#   verify         contents: read,  no secrets   build, test, pack, verify the packages
#   publish-github contents: write, no NuGet key create the draft release, attach the artefacts
#   publish-nuget  no repo write,   NuGet key    push to nuget.org
#   finalize       contents: write, no secrets   take the release out of draft
#
# None of the build — targets, analysers, restored tools — needs either write access or the NuGet
# key, so none of it runs where they are. A compromised dependency in the build cannot publish.

on:
  push:
    tags:
      - "v*"
  # A manual run is always a dry run: it builds, verifies and packs, and every publishing job is
  # gated on the event being a tag push. There is deliberately no input to override that.
  workflow_dispatch:

# Deny by default; each job adds only what it needs.
permissions: {}

# Queued, never cancelled. A release writes to two systems that cannot be rolled back, and
# cancelling one between the GitHub release and the NuGet push would leave a tag published as a
# release with no packages behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  verify:
    name: build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For build provenance. Signed here rather than in a publishing job because the claim being
      # made is about where these bytes were built, and this is the job that built them.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Source Link needs real commit history to point at, and the tag-ancestry check below
          # needs the default branch.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Jev.slnx

      - name: Build
        run: dotnet build src/Jev.slnx -c Release --no-restore

      # The generated sources must match the committed contract. Shipping a package built from
      # stale generated code would be undetectable afterwards.
      - name: Verify generated sources
        run: dotnet run --project src/tools/Kkdev92.Jev.CodeGen -c Release --no-build -- verify

      # The integration project runs and skips itself for want of a key. Excluding it would match
      # no tests in that assembly, which the test platform treats as a failed run.
      - name: Test
        run: dotnet test --solution src/Jev.slnx -c Release --no-build -- --filter-not-trait Category=Package

      - name: Native AOT smoke
        run: |
          dotnet publish src/tests/Kkdev92.Jev.AotSmokeTests \
            -c Release -p:PublishAot=true -o artifacts/aot
          ./artifacts/aot/Kkdev92.Jev.AotSmokeTests

      # A tag says one version and Directory.Build.props says another, and only one of them ends
      # up on nuget.org — permanently, because a published version cannot be replaced. So they are
      # required to agree before packing or publishing.
      - name: Check the tag against the package version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"

          # The regular expression from semver.org, not an approximation of it.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          semver="${semver}"'(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?'
          semver="${semver}"'$'

          if ! printf '%s' "$tag" | grep -Eq "$semver"; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a semantic version. Expected vMAJOR.MINOR.PATCH[-prerelease]." >&2
            exit 1
          fi

          # No +build.metadata, even though SemVer allows it. NuGet strips it when normalising, so
          # the package file would not carry the tag's version, and the artefact check below would
          # fail after the packages were built.
          case "$tag" in
            *+*)
              echo "::error::Tag '${GITHUB_REF_NAME}' carries build metadata, which NuGet discards." >&2
              exit 1
              ;;
          esac

          for project in src/*/[A-Z]*.csproj; do
            version=$(dotnet msbuild "$project" -getProperty:PackageVersion -v:quiet | tr -d '[:space:]')

            if [ "$version" != "$tag" ]; then
              echo "::error::${project} would publish ${version}, but the tag says ${tag}." >&2
              exit 1
            fi
          done

          echo "All packages publish ${tag}."

      # A tag on a branch that was never merged still builds, packs and publishes — and the readme
      # inside those packages links to blob/main, so every documentation link on nuget.org would
      # 404 for a version that cannot be replaced.
      - name: Check the tag is on the default branch
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_SHA} is not reachable from origin/${DEFAULT_BRANCH}. Merge it before tagging." >&2
            exit 1
          fi

          echo "The tagged commit is on ${DEFAULT_BRANCH}."
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      # The same agreement, for a run that has no tag: every project must agree with the others, or
      # a dry run would say nothing useful about what a real release would produce.
      - name: Check the package versions agree
        if: github.event_name != 'push'
        run: |
          expected=""

          for project in src/*/[A-Z]*.csproj; do
            version=$(dotnet msbuild "$project" -getProperty:PackageVersion -v:quiet | tr -d '[:space:]')
            expected="${expected:-$version}"

            if [ "$version" != "$expected" ]; then
              echo "::error::${project} is ${version}, but the others are ${expected}." >&2
              exit 1
            fi
          done

          echo "All packages are ${expected}."
          echo "PACKAGE_VERSION=${expected}" >> "$GITHUB_ENV"

      # Package validation runs as part of pack.
      - name: Pack
        run: dotnet pack src/Jev.slnx -c Release --no-build -o artifacts

      # Exactly two packages and two symbol packages, named for the version. A missing or extra one
      # means something changed about what ships, which is not a thing to notice afterwards.
      - name: Check the artefact set
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            expected="${PACKAGE_VERSION}"
          fi

          nupkgs=$(ls artifacts/*.nupkg 2>/dev/null | wc -l)
          snupkgs=$(ls artifacts/*.snupkg 2>/dev/null | wc -l)

          if [ "$nupkgs" -ne 2 ] || [ "$snupkgs" -ne 2 ]; then
            echo "::error::Expected 2 nupkg and 2 snupkg, found ${nupkgs} and ${snupkgs}." >&2
            ls -l artifacts/ >&2
            exit 1
          fi

          for package in artifacts/*.nupkg; do
            case "$package" in
              *".${expected}.nupkg") ;;
              *) echo "::error::${package} is not version ${expected}." >&2; exit 1 ;;
            esac
          done

      # The last chance to catch something that should not ship. A published version cannot be
      # replaced, only unlisted.
      - name: Verify the packages
        run: dotnet test --project src/tests/Kkdev92.Jev.Tests -c Release --no-build -- --filter-trait Category=Package

      # A regression that exists only in what gets packed — missing trimming metadata, a nuspec that
      # resolves differently — is invisible to the ProjectReference smoke above.
      - name: Native AOT from the packages alone
        run: |
          version=$(ls artifacts/Kkdev92.Jev.[0-9]*.nupkg | head -1 \
            | sed 's|.*/Kkdev92[.]Jev[.]||; s|[.]nupkg$||')

          mkdir -p "${RUNNER_TEMP}/aot-consumer"
          cd "${RUNNER_TEMP}/aot-consumer"

          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="artifacts" value="${GITHUB_WORKSPACE}/artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="artifacts"><package pattern="Kkdev92.Jev*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

          cat > Consumer.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <PublishAot>true</PublishAot>
              <TrimmerSingleWarn>false</TrimmerSingleWarn>
              <JsonSerializerIsReflectionEnabledByDefault>false</JsonSerializerIsReflectionEnabledByDefault>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Kkdev92.Jev" Version="${version}" />
              <PackageReference Include="Kkdev92.Jev.DependencyInjection" Version="${version}" />
            </ItemGroup>
          </Project>
          EOF

          cat > Program.cs <<'EOF'
          using Kkdev92.Jev;
          using Kkdev92.Jev.DependencyInjection;
          using Microsoft.Extensions.DependencyInjection;

          var services = new ServiceCollection();
          services.AddJev(o => o.Credential = new StaticJevCredential("sk-package-consumer-not-a-key"));

          using var provider = services.BuildServiceProvider();

          var builder = new JevDecisionPlanBuilder();
          builder.AddNoul("urgent", "Does this need an answer today?");

          Console.WriteLine(provider.GetRequiredService<JevClient>() is not null);
          Console.WriteLine(builder.Build().QuestionCount);
          Console.WriteLine("package-only AOT ok");
          EOF

          NUGET_PACKAGES="${RUNNER_TEMP}/aot-cache" dotnet publish -c Release -o out
          ./out/Consumer | tee result.txt
          grep -q "package-only AOT ok" result.txt

      # A signed statement that these exact bytes came out of this workflow, at this commit, in this
      # repository — verifiable by anyone with `gh attestation verify`. Only on a tag: an
      # attestation for a dry run would claim provenance for something that was never released.
      - name: Attest the packages
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # Everything downstream consumes this rather than rebuilding. The packages that were tested
      # are the packages that get published.
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  # The download half of the pipeline, exercised where nothing is published. download-artifact
  # otherwise appears only in the publishing jobs, so a problem with a new version of it would first
  # show up part-way through a release that cannot be redone.
  dry-run-download:
    name: check the artefacts survive a download
    needs: verify
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: artifacts

      - name: Check what came back
        run: |
          nupkgs=$(ls artifacts/*.nupkg 2>/dev/null | wc -l)
          snupkgs=$(ls artifacts/*.snupkg 2>/dev/null | wc -l)

          if [ "$nupkgs" -ne 2 ] || [ "$snupkgs" -ne 2 ]; then
            echo "::error::Downloaded ${nupkgs} nupkg and ${snupkgs} snupkg, expected 2 and 2." >&2
            ls -l artifacts/ >&2
            exit 1
          fi

          for package in artifacts/*.nupkg artifacts/*.snupkg; do
            if ! unzip -tqq "$package"; then
              echo "::error::${package} did not survive the round trip as a readable archive." >&2
              exit 1
            fi
          done

          echo "4 artefacts downloaded and readable."

  # Before NuGet, because this is the half that can be undone.
  publish-github:
    name: attach to a draft GitHub release
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout. This job needs the packages, not the source, and code it does not check out is
      # code that cannot run while `contents: write` is live.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: artifacts

      - name: Prepare the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} is already published. Refusing to overwrite it." >&2
              exit 1
            fi
          else
            # A tag carrying a SemVer pre-release suffix is a pre-release on GitHub too, as it is on
            # nuget.org, rather than "Latest".
            case "${GITHUB_REF_NAME#v}" in
              *-*) prerelease=--prerelease ;;
              *)   prerelease= ;;
            esac

            gh release create "${GITHUB_REF_NAME}" --draft ${prerelease} \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi

          # No --clobber: a collision means this tag has been released before, and replacing the
          # assets of an earlier attempt would destroy the only copy of them.
          gh release upload "${GITHUB_REF_NAME}" artifacts/*.nupkg artifacts/*.snupkg

  publish-nuget:
    name: push to nuget.org
    needs: publish-github
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # For the OIDC token, and nothing else.
      id-token: write
    #
    # Trusted Publishing rather than a stored API key. nuget.org validates a GitHub-signed OIDC
    # token against a policy naming this owner, this repository, this workflow file and the
    # `release` environment, then issues an API key that lasts an hour. The policy has to exist on
    # the nuget.org account first, and its four fields must match exactly: owner, repository,
    # `release.yml` (file name only), `release`.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Immediately before the push: the key expires in an hour.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org profile name, in the clear on purpose: nuget.org prints it on every
          # package page as the owner. It is a profile name and never an email address.
          user: kkdev92

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::No API key came back from nuget.org. Check that a Trusted Publishing" \
                 "policy exists for this owner, repository, release.yml and the release environment." >&2
            exit 1
          fi

          # No --skip-duplicate. A version already on nuget.org means this tag was published before,
          # and continuing would attach today's build to yesterday's version while reporting success.
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json

  finalize:
    name: publish the GitHub release
    needs: publish-nuget
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Last, so the release stops being a draft only once the packages are on nuget.org.
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
